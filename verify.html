<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>veilpiercer-ledger // verify</title>
<style>
:root{--bg:#0a0a0f;--fg:#e8e8f0;--dim:#6b6b8a;--ok:#3ddc97;--bad:#ff5c7a;--accent:#7c5cff}
*{margin:0;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{background:var(--bg);color:var(--fg);min-height:100vh;padding:2rem;max-width:760px;margin:auto}
h1{font-size:1.05rem;letter-spacing:.18em;color:var(--accent);margin-bottom:.4rem}
.sub{color:var(--dim);font-size:.82rem;margin-bottom:1.6rem;line-height:1.5}
textarea{width:100%;min-height:150px;background:#12121a;border:1px solid #2a2a3a;border-radius:8px;color:var(--fg);padding:1rem;font-size:.78rem;resize:vertical}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:.55rem 1.3rem;font-size:.82rem;cursor:pointer;margin-top:.9rem}
button:hover{filter:brightness(1.15)}
#out{margin-top:1.2rem;padding:1rem;border-radius:8px;background:#12121a;border:1px solid #2a2a3a;font-size:.78rem;white-space:pre-wrap;word-break:break-all;min-height:2.4rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1rem}
.stat{background:#12121a;border:1px solid #2a2a3a;border-radius:6px;padding:.45rem .9rem;font-size:.72rem}
.stat b{color:var(--accent)}
footer{margin-top:2.5rem;color:var(--dim);font-size:.7rem}
a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<h1>VEILPIERCER-LEDGER</h1>
<p class="sub">paste a chain array or a full bundle JSON. verification runs entirely in your browser using the Web Crypto API. no backend, no trust, no account.</p>
<textarea id="inp" placeholder='{"v":1,"chain":[...],"sealed":{...}}'></textarea>
<button onclick="run()">VERIFY</button>
<div class="row">
<div class="stat">events: <b id="sE">0</b></div>
<div class="stat">sealed: <b id="sS">0</b></div>
<div class="stat">status: <b id="sT">idle</b></div>
</div>
<div id="out" class="dim">ready</div>
<footer>part of the <a href="https://github.com/flipperspectives-crypto/veilpiercer-ledger">veilpiercer-ledger</a> stack. the anti-PackScan.</footer>
<script>
async function H(b){const x=await crypto.subtle.digest("SHA-256",b);return[...new Uint8Array(x)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function C(o){return JSON.stringify(o,Object.keys(o).sort())}
async function run(){
 const raw=document.getElementById("inp").value.trim(),o=document.getElementById("out");
 if(!raw){o.textContent="paste a chain or bundle first";o.className="dim";return}
 let d;try{d=JSON.parse(raw)}catch(e){o.textContent="invalid JSON: "+e.message;o.className="bad";return}
 const ch=Array.isArray(d)?d:d.chain;
 document.getElementById("sE").textContent=ch&&ch.length||0;
 document.getElementById("sS").textContent=d.sealed?Object.keys(d.sealed).length:0;
 document.getElementById("sT").textContent="checking";
 if(!ch||!ch.length){o.textContent="no chain found";o.className="bad";return}
 let p="0".repeat(64),seen=new Set();
 for(let i=0;i<ch.length;i++){
  const r=ch[i];
  for(const k of["ts","agent","event","prev","nonce","hash"])if(r[k]==null){o.textContent="missing "+k+" @"+i;o.className="bad";return}
  if(r.prev!==p){o.textContent="broken link @"+i;o.className="bad";return}
  if(r.hash.length!==64||seen.has(r.hash)){o.textContent="dup/bad hash @"+i;o.className="bad";return}
  seen.add(r.hash);
  const b={};for(const k of Object.keys(r))if(k!=="hash")b[k]=r[k];
  if(r.hash!==await H(new TextEncoder().encode(C(b)))){o.textContent="hash mismatch @"+i;o.className="bad";return}
  if(i&&r.ts<=ch[i-1].ts){o.textText="timestamp rewind @"+i;o.className="bad";return}
  p=r.hash;
 }
 let extra="";
 if(d.sealed){extra="\nsealed batches: "+Object.keys(d.sealed).length;
  for(const rt of Object.keys(d.sealed)){const s=d.sealed[rt];extra+="\n v"+s.version+" root "+rt.slice(0,16)+"... leaves "+s.leaf_count+" ("+s.method+")"}}
 o.textContent=ch.length+" events verified, chain intact"+extra;o.className="ok";
 document.getElementById("sT").textContent="VALID";
}
</script>
</body>
</html>
